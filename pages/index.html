<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyeonjun Cheon — AI Engineer</title>
<meta name="description" content="딥러닝 아키텍처와 LLM 서빙 최적화를 직접 구현하며 기록하는 기술 블로그.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F6F7F9;
    --ink:#10131A;
    --ink-soft:#5B6270;
    --line:#E7E9EE;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --maxw: 880px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  img,svg{display:block; max-width:100%;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:var(--maxw);
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
  }
  .logo{
    display:block;
    width:36px;
    height:36px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--line);
  }

  /* ---------- HERO ---------- */
  .hero{
    max-width:var(--maxw);
    margin:0 auto;
    padding:72px 24px 40px;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:40px;
    align-items:center;
  }
  .hero-minimal{
    grid-template-columns:1fr;
    justify-items:center;
    padding:72px 24px 40px;
  }
  .github-icon-link{
    color:var(--ink);
    display:inline-flex;
    padding:16px;
    border-radius:50%;
    border:1px solid var(--line);
    transition:border-color .15s ease, transform .15s ease;
  }
  .github-icon-link:hover{
    border-color:var(--ink);
    transform:translateY(-2px);
  }

  /* ---------- CATEGORY FILTER ---------- */
  .filter-wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 24px;
  }
  .filter-label{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .filter-pills{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .pill{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:99px;
    padding:5px 12px;
    cursor:pointer;
    transition:
      background .15s ease,
      color .15s ease,
      border-color .15s ease,
      transform .12s ease;
    user-select:none;
    -webkit-user-select:none;
  }
  .pill:hover{
    border-color:var(--ink-soft);
    color:var(--ink);
    transform:translateY(-1px);
  }
  .pill.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
    transform:none;
  }
  .pill.active:hover{
    background:#2a2f3a;
    border-color:#2a2f3a;
    transform:none;
  }

  /* ---------- POSTS ---------- */
  .posts{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 96px;
  }
  .posts-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:18px;
    min-height:16px;
    transition:opacity .15s ease;
  }
  .posts-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
  }
  .post-card{
    background:var(--bg);
    border:none;
    border-radius:22px;
    padding:24px 24px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    box-shadow:
      0 1px 2px rgba(16,19,26,0.04),
      0 8px 24px rgba(16,19,26,0.07);
    transition:box-shadow .22s ease, transform .22s ease, opacity .2s ease;
  }
  .post-card:hover{
    box-shadow:
      0 2px 4px rgba(16,19,26,0.06),
      0 16px 36px rgba(16,19,26,0.12);
    transform:translateY(-3px);
  }
  .post-card.hidden{
    display:none;
  }
  .post-date{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .post-title{
    font-size:17px;
    font-weight:700;
    line-height:1.4;
    letter-spacing:-0.005em;
  }
  .post-excerpt{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    flex:1;
  }
  .post-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:auto;
  }
  .post-tag{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    transition:color .12s ease;
  }
  .post-tag.match{
    color:var(--ink);
    font-weight:600;
  }

  /* 빈 상태 */
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:64px 0;
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-soft);
    display:none;
  }
  .empty-state.visible{display:block;}

  /* ---------- PR STATUS ---------- */
  .pr-section{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 96px;
  }
  .pr-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    border-top:1px solid var(--line);
    padding-top:32px;
    margin-bottom:8px;
  }
  .pr-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
  }
  .pr-summary{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .pr-updated{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .pr-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .pr-link{
    text-decoration:none;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:10px;
    transition:border-color .15s ease, background .15s ease;
  }
  .pr-link:hover{border-color:var(--ink-soft); background:var(--bg-soft);}
  .pr-link:hover .pr-link-title{color:var(--ink);}
  .pr-meta{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .pr-repo{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .pr-state{
    font-family:var(--mono);
    font-size:10.5px;
    font-weight:600;
    padding:1px 8px;
    border-radius:99px;
  }
  .pr-state.open{background:var(--ink); color:#fff;}
  .pr-state.merged{border:1px solid var(--ink-soft); color:var(--ink-soft);}
  .pr-state.closed{border:1px solid var(--line); color:var(--ink-soft);}
  .pr-state.ci-failure{
    border:1px solid var(--ink);
    color:var(--ink);
    font-weight:700;
  }
  .pr-link-title{
    font-size:14.5px;
    font-weight:600;
    line-height:1.4;
    color:var(--ink);
    letter-spacing:-0.005em;
  }
  .pr-read-row{
    margin-top:2px;
    display:flex;
    justify-content:flex-end;
  }
  .pr-read{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    letter-spacing:0.01em;
  }
  .pr-link:hover .pr-read{color:var(--ink);}
  .pr-empty{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--ink-soft);
    padding:24px 4px;
  }

  /* ---------- CONTRIB (기여한 글) ---------- */
  .contrib-section{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 96px;
  }
  .contrib-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
  }
  .contrib-card{
    text-decoration:none;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 20px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:box-shadow .2s ease, transform .2s ease, border-color .15s ease;
  }
  .contrib-card:hover{
    border-color:var(--ink-soft);
    box-shadow:0 8px 24px rgba(16,19,26,0.07);
    transform:translateY(-2px);
  }
  .contrib-meta{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .contrib-repo{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .contrib-tag{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:99px;
    padding:1px 8px;
  }
  .contrib-title{
    font-size:15px;
    font-weight:600;
    line-height:1.4;
    color:var(--ink);
    letter-spacing:-0.005em;
  }
  .contrib-excerpt{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:760px){
    .hero{grid-template-columns:1fr; padding-top:40px;}
    .hero-minimal{padding:48px 24px 32px;}
    .posts-grid{grid-template-columns:1fr;}
    .contrib-grid{grid-template-columns:1fr;}
    .filter-pills{gap:5px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <img class="logo" src="mark.jpg" alt="chjnett">
  </nav>
</header>

<section class="hero hero-minimal">
  <a href="https://github.com/chjnett" class="github-icon-link" target="_blank" rel="noopener" aria-label="GitHub 프로필로 이동">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor" aria-hidden="true">
      <path d="M12 0.5C5.65 0.5 0.5 5.65 0.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.72.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.53-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.11 3.06.74.8 1.19 1.83 1.19 3.09 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.07.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.21.66.79.55A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35 0.5 12 0.5Z"/>
    </svg>
  </a>
</section>

<!-- 카테고리 필터 -->
<div class="filter-wrap" id="filterWrap" style="display:none" aria-label="카테고리 필터">
  <p class="filter-label">Category</p>
  <div class="filter-pills" id="filterPills" role="group" aria-label="태그 필터"></div>
</div>

<section class="posts">
  <p class="posts-count" id="postsCount" aria-live="polite"></p>
  <div class="posts-grid" id="postsGrid">
    <div class="empty-state" id="emptyState">해당 카테고리의 글이 없습니다.</div>
  </div>
</section>

<!-- 오픈소스 기여한 글 -->
<section class="contrib-section" id="contribSection" style="display:none" aria-label="오픈소스 기여한 글">
  <div class="pr-head">
    <span class="pr-title">기여한 글</span>
    <span class="pr-summary" id="contribCount"></span>
  </div>
  <div class="contrib-grid" id="contribGrid"></div>
</section>

<!-- GitHub PR 상태 -->
<section class="pr-section" id="prSection" style="display:none" aria-label="오픈소스 기여 PR 상태">
  <div class="pr-head">
    <span class="pr-title">Open Source PRs</span>
    <span class="pr-summary" id="prSummary"></span>
  </div>
  <p class="pr-updated" id="prUpdated"></p>
  <div class="pr-list" id="prList"></div>
</section>

<script>
  function escapeHtml(value) {
    return value
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let allPosts   = [];
  let activeTag  = null;   // null = 전체

  /* ── 필터 버튼 클릭 ── */
  function setTag(tag) {
    activeTag = tag;

    // 버튼 active 상태 갱신
    document.querySelectorAll('.pill').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tag === (tag ?? '__all__'));
      btn.setAttribute('aria-pressed', btn.dataset.tag === (tag ?? '__all__') ? 'true' : 'false');
    });

    renderCards();
  }

  /* ── 카드 표시/숨김 ── */
  function renderCards() {
    const cards  = document.querySelectorAll('.post-card');
    let visible  = 0;

    cards.forEach((card) => {
      const tags = JSON.parse(card.dataset.tags || '[]');
      const show = activeTag === null || tags.includes(activeTag);
      card.classList.toggle('hidden', !show);
      if (show) visible++;

      // 일치 태그 강조
      card.querySelectorAll('.post-tag').forEach((el) => {
        el.classList.toggle('match', activeTag !== null && el.dataset.tag === activeTag);
      });
    });

    // 카운트 텍스트
    const countEl = document.getElementById('postsCount');
    if (activeTag) {
      countEl.textContent = `#${activeTag} — ${visible}개`;
    } else {
      countEl.textContent = `전체 ${visible}개`;
    }

    // 빈 상태
    document.getElementById('emptyState').classList.toggle('visible', visible === 0);
  }

  /* ── 필터 버튼 빌드 ── */
  function buildFilter(posts) {
    const tagCount = {};
    posts.forEach((p) => {
      (p.tags || []).forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; });
    });

    // 빈도순 정렬
    const sorted = Object.entries(tagCount).sort((a, b) => b[1] - a[1]);

    const wrap = document.getElementById('filterPills');

    // 전체 버튼
    const all = document.createElement('button');
    all.className = 'pill active';
    all.textContent = '전체';
    all.dataset.tag = '__all__';
    all.setAttribute('aria-pressed', 'true');
    all.addEventListener('click', () => setTag(null));
    wrap.appendChild(all);

    // 태그 버튼
    sorted.forEach(([tag, cnt]) => {
      const btn = document.createElement('button');
      btn.className = 'pill';
      btn.textContent = `#${tag}`;
      btn.dataset.tag = tag;
      btn.setAttribute('aria-pressed', 'false');
      btn.title = `${cnt}개의 글`;
      btn.addEventListener('click', () => setTag(tag));
      wrap.appendChild(btn);
    });

    document.getElementById('filterWrap').style.display = '';
  }

  /* ── 카드 빌드 ── */
  function buildCards(posts) {
    const grid = document.getElementById('postsGrid');

    // 기존 카드 제거 (emptyState는 유지)
    grid.querySelectorAll('.post-card').forEach((el) => el.remove());

    posts.forEach((post) => {
      // 오픈소스 기여글(oss-*)은 아래 '기여한 글' 섹션에서 별도 표시.
      if (post.slug.startsWith('oss-')) return;
      const tagsJson = JSON.stringify(post.tags || []);
      const tagsHtml = (post.tags || []).map((tag) =>
        `<span class="post-tag" data-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</span>`
      ).join('');

      const a = document.createElement('a');
      a.className = 'post-card';
      a.href = `/posts/${encodeURIComponent(post.slug)}`;
      a.dataset.tags = tagsJson;
      a.innerHTML = `
        <span class="post-date">${escapeHtml((post.published_at || '').slice(0, 10))}</span>
        <h2 class="post-title">${escapeHtml(post.title)}</h2>
        <p class="post-excerpt">${escapeHtml(post.excerpt || '')}</p>
        <div class="post-tags">${tagsHtml}</div>
      `;
      // emptyState 앞에 삽입
      grid.insertBefore(a, document.getElementById('emptyState'));
    });
  }

  /* ── 기여한 글(oss-*) 카드 빌드 ── */
  function buildContrib(posts) {
    const section = document.getElementById('contribSection');
    const grid = document.getElementById('contribGrid');
    const contrib = posts.filter((p) => p.slug.startsWith('oss-'));
    if (!contrib.length) return;
    section.style.display = '';
    document.getElementById('contribCount').textContent = `${contrib.length}건`;
    grid.innerHTML = contrib
      .map((p) => {
        const tags = (p.tags || []).slice(0, 3)
          .map((t) => `<span class="contrib-tag">#${escapeHtml(t)}</span>`).join('');
        return `<a class="contrib-card" href="/oss/${encodeURIComponent(p.slug)}">
          <div class="contrib-meta">
            <span class="contrib-repo">OSS 기여</span>
            ${tags}
          </div>
          <div class="contrib-title">${escapeHtml(p.title)}</div>
          <p class="contrib-excerpt">${escapeHtml(p.excerpt || '')}</p>
        </a>`;
      })
      .join('');
  }

  /* ── 데이터 로드 ── */
  fetch('/api/posts')
    .then((res) => res.json())
    .then((posts) => {
      // 기여글(oss-*)은 별도 섹션으로, 일반 글 목록/필터에서는 제외
      buildContrib(posts);                              // 기여한 글 섹션
      allPosts = posts.filter((p) => !p.slug.startsWith('oss-'));
      buildCards(allPosts);
      buildFilter(allPosts);
      renderCards();         // 초기 카운트 표시
    })
    .catch((err) => console.error('failed to load posts', err));

  /* ── PR 상태 로드 ── */
  function loadPrs() {
    fetch('/api/prs')
      .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
      .then((data) => {
        const section = document.getElementById('prSection');
        if (!data.items || data.items.length === 0) {
          section.style.display = '';
          document.getElementById('prSummary').textContent = '기여한 PR 없음';
          return;
        }

        // 상태 배지 렌더 (모노크롬: 텍스트·테두리·흑백 반전만)
        function stateBadge(pr) {
          if (pr.merged) return '<span class="pr-state merged">merged</span>';
          if (pr.state === 'open') {
            const ci = pr.ci_combined;
            if (ci === 'failure') {
              return '<span class="pr-state ci-failure">✗ CI failed</span>';
            }
            if (ci === 'pending') {
              return '<span class="pr-state open">open · pending</span>';
            }
            return '<span class="pr-state open">open</span>';
          }
          return '<span class="pr-state closed">closed</span>';
        }

        const items = data.items
          .map((pr) => {
            // 연관 기여 글이 있으면 /oss/:slug로, 없으면 GitHub PR로 폴백.
            const href = pr.post_slug ? `/oss/${encodeURIComponent(pr.post_slug)}` : pr.url;
            const external = !pr.post_slug;
            const title = escapeHtml(pr.title || `#${pr.pr_number}`);
            const repo = escapeHtml(pr.repo || '');
            const readLink = pr.post_slug
              ? '<span class="pr-read">이 기여 · 글 보기 →</span>'
              : '<span class="pr-read">GitHub에서 보기 →</span>';
            return `<a class="pr-link" href="${href}" ${external ? 'target="_blank" rel="noopener"' : ''}>
              <div class="pr-meta">
                <span class="pr-repo">${repo} #${pr.pr_number}</span>
                ${stateBadge(pr)}
              </div>
              <div class="pr-link-title">${title}</div>
              <div class="pr-read-row">${readLink}</div>
            </a>`;
          })
          .join('');

        document.getElementById('prList').innerHTML = items;
        document.getElementById('prSummary').textContent =
          `${data.items.length}건 · ` +
          (data.open > 0 ? `열림 ${data.open}건` : '열림 없음') +
          (data.merged > 0 ? ` · 머지 ${data.merged}건` : '');
        const updated = data.last_updated ? (data.last_updated.slice(0, 16) || '').replace('T', ' ') : '—';
        document.getElementById('prUpdated').textContent = `마지막 갱신: ${updated}`;
        section.style.display = '';
      })
      .catch((err) => console.warn('failed to load PRs', err));
  }
  loadPrs();
</script>

</body>
</html>
