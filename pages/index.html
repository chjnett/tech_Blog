<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hyeonjun Cheon — AI Engineer</title>
<meta name="description" content="딥러닝 아키텍처와 LLM 서빙 최적화를 직접 구현하며 기록하는 기술 블로그.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --bg-soft:#F6F7F9;
    --ink:#10131A;
    --ink-soft:#5B6270;
    --line:#E7E9EE;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --maxw: 880px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit; text-decoration:none;}
  img,svg{display:block; max-width:100%;}

  /* ---------- NAV ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .nav{
    max-width:var(--maxw);
    margin:0 auto;
    padding:18px 24px;
    display:flex;
    align-items:center;
  }
  .logo{
    display:block;
    width:36px;
    height:36px;
    border-radius:50%;
    object-fit:cover;
    border:1px solid var(--line);
  }

  /* ---------- HERO ---------- */
  .hero{
    max-width:var(--maxw);
    margin:0 auto;
    padding:72px 24px 40px;
    display:grid;
    grid-template-columns:1.1fr 0.9fr;
    gap:40px;
    align-items:center;
  }
  .hero-minimal{
    grid-template-columns:1fr;
    justify-items:center;
    padding:72px 24px 40px;
  }
  .hero-name{
    font-family:var(--mono);
    font-size:22px;
    font-weight:700;
    color:var(--ink);
    letter-spacing:-0.01em;
    margin-top:18px;
  }
  .hero-tagline{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .hero-3d{
    display:block;
    width:320px;
    height:300px;
    margin-top:10px;
    outline:none;
  }
  .github-icon-link{
    color:var(--ink);
    display:inline-flex;
    padding:16px;
    border-radius:50%;
    border:1px solid var(--line);
    transition:border-color .15s ease, transform .15s ease;
  }
  .github-icon-link:hover{
    border-color:var(--ink);
    transform:translateY(-2px);
  }

  /* ---------- CATEGORY FILTER ---------- */
  .filter-wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 24px;
  }
  .filter-label{
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .filter-pills{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
  }
  .pill{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    background:var(--bg-soft);
    border:1px solid var(--line);
    border-radius:99px;
    padding:5px 12px;
    cursor:pointer;
    transition:
      background .15s ease,
      color .15s ease,
      border-color .15s ease,
      transform .12s ease;
    user-select:none;
    -webkit-user-select:none;
  }
  .pill:hover{
    border-color:var(--ink-soft);
    color:var(--ink);
    transform:translateY(-1px);
  }
  .pill.active{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
    transform:none;
  }
  .pill.active:hover{
    background:#2a2f3a;
    border-color:#2a2f3a;
    transform:none;
  }

  /* ---------- POSTS ---------- */
  .posts{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 96px;
  }
  .posts-count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:18px;
    min-height:16px;
    transition:opacity .15s ease;
  }
  .posts-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
  }
  .post-card{
    background:var(--bg);
    border:none;
    border-radius:22px;
    padding:24px 24px 22px;
    display:flex;
    flex-direction:column;
    gap:12px;
    box-shadow:
      0 1px 2px rgba(16,19,26,0.04),
      0 8px 24px rgba(16,19,26,0.07);
    transition:box-shadow .22s ease, transform .22s ease, opacity .2s ease;
  }
  .post-card:hover{
    box-shadow:
      0 2px 4px rgba(16,19,26,0.06),
      0 16px 36px rgba(16,19,26,0.12);
    transform:translateY(-3px);
  }
  .post-card.hidden{
    display:none;
  }
  .post-date{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--ink-soft);
  }
  .post-title{
    font-size:17px;
    font-weight:700;
    line-height:1.4;
    letter-spacing:-0.005em;
  }
  .post-excerpt{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    flex:1;
  }
  .post-tags{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-top:auto;
  }
  .post-tag{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    transition:color .12s ease;
  }
  .post-tag.match{
    color:var(--ink);
    font-weight:600;
  }

  /* 빈 상태 */
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:64px 0;
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-soft);
    display:none;
  }
  .empty-state.visible{display:block;}

  /* ---------- PR STATUS (브랜치 + 기여 패널) ---------- */
  .oss-grid{
    max-width:var(--maxw);
    margin:0 auto;
    padding:0 24px 96px;
  }
  /* 하나의 통일된 박스: 좌(브랜치) + 우(기여) */
  .oss-panel{
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
    background:var(--bg);
  }
  /* 헤더 행: 두 열 제목 */
  .oss-heads{
    display:grid;
    grid-template-columns:1fr 1fr;
    border-bottom:1px solid var(--line);
  }
  .oss-head{
    padding:22px 24px 14px;
    min-width:0;
  }
  .oss-head + .oss-head{ border-left:1px solid var(--line); }
  .oss-head .pr-updated{ margin-bottom:0; }
  /* 카드 쌍 행: [PR 카드 | 기여 카드] — 같은 행 높이로 하단 정렬 */
  .oss-rows{
    padding:18px 24px 24px;
  }
  .oss-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:14px;
    align-items:stretch;
  }
  .oss-row:last-child{ margin-bottom:0; }
  .oss-row .pr-branch{ height:auto; margin-bottom:0; }
  .oss-row .contrib-card{ height:auto; }
  .pr-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .pr-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:600;
  }
  .pr-summary{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .pr-updated{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  /* ── PR 브랜치 (카드형 — 기여 카드와 같은 칸 느낌) ── */
  .pr-list{display:block;}
  .pr-branch{
    position:relative;
    display:flex;
    flex-direction:column;
    text-decoration:none;
    border:1px solid var(--line);
    border-radius:16px;
    background:var(--bg);
    padding:16px 18px 14px 20px;
    margin-bottom:12px;
    overflow:hidden;
    transition:border-color .15s ease, box-shadow .2s ease, transform .2s ease;
  }
  .pr-branch:hover{
    border-color:var(--ink-soft);
    box-shadow:0 8px 24px rgba(16,19,26,0.07);
    transform:translateY(-2px);
  }
  .pr-branch:hover .pr-branch-title{color:var(--ink);}
  /* 카드 안 브랜치 노드: 점 + 가지 선 — 클릭 시 GitHub PR로 이동 */
  .pr-node{
    position:absolute;
    left:20px; top:22px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    text-decoration:none;
  }
  .pr-node::before{   /* 커밋 노드 점 */
    content:'';
    width:9px; height:9px;
    border-radius:50%;
    background:var(--ink);
    border:2px solid var(--line);
    box-sizing:border-box;
    transition:box-shadow .12s ease;
  }
  .pr-node::after{    /* 가지 선 */
    content:'';
    width:14px; height:0;
    border-top:1.5px solid var(--line);
    transition:border-color .12s ease;
  }
  .pr-node:hover::before{box-shadow:0 0 0 3px rgba(16,19,26,0.12);}
  .pr-node:hover::after{border-color:var(--ink-soft);}
  .pr-branch.merged .pr-node::before{background:#fff; border-color:var(--ink-soft);}
  .pr-branch.closed .pr-node::before{background:var(--bg-soft); border-color:var(--ink-soft);}
  .pr-branch.ci-failure .pr-node::before{background:var(--ink); border-color:var(--ink); box-shadow:0 0 0 3px rgba(16,19,26,0.12);}
  /* 카드 본문 링크 (노드 공간만큼 좌측 여백) */
  .pr-branch-main{
    display:block;
    padding-left:32px;
    text-decoration:none;
  }
  .pr-branch-row{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .pr-branch-repo{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .pr-branch-num{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .pr-branch-title{
    font-size:15px;
    font-weight:600;
    line-height:1.4;
    color:var(--ink);
    letter-spacing:-0.005em;
    margin-top:4px;
  }
  .pr-branch-foot{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:auto;               /* 카드 하단에 붙이기 (기여 카드와 같은 느낌) */
    padding-top:10px;
    flex-wrap:wrap;
  }
  .pr-branch-read{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
  }
  .pr-branch:hover .pr-branch-read{color:var(--ink);}
  .pr-state{
    font-family:var(--mono);
    font-size:9.5px;
    font-weight:600;
    padding:1px 7px;
    border-radius:99px;
  }
  .pr-state.open{background:var(--ink); color:#fff;}
  .pr-state.merged{border:1px solid var(--ink-soft); color:var(--ink-soft);}
  .pr-state.closed{border:1px solid var(--line); color:var(--ink-soft);}
  .pr-state.ci-failure{
    border:1px solid var(--ink);
    color:var(--ink);
    font-weight:700;
  }
  .pr-btn{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    text-decoration:underline;
    text-underline-offset:2px;
  }

  /* ---------- CONTRIB (기여한 글) ---------- */
  .contrib-section{
    min-width:0;
  }
  .contrib-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:22px;
  }
  /* 좌우 배치된 우측 열에서는 카드를 1열 세로로 (폭이 좁으므로) */
  .oss-panel .contrib-grid{
    grid-template-columns:1fr;
    gap:14px;
  }
  .contrib-card{
    text-decoration:none;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px 20px 18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:hidden;
    transition:box-shadow .2s ease, transform .2s ease, border-color .15s ease;
  }
  .contrib-card:hover{
    border-color:var(--ink-soft);
    box-shadow:0 8px 24px rgba(16,19,26,0.07);
    transform:translateY(-2px);
  }
  .contrib-meta{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .contrib-repo{
    font-family:var(--mono);
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .contrib-tag{
    font-family:var(--mono);
    font-size:10px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    border-radius:99px;
    padding:1px 8px;
  }
  .contrib-title{
    font-size:15px;
    font-weight:600;
    line-height:1.4;
    color:var(--ink);
    letter-spacing:-0.005em;
  }
  .contrib-excerpt{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.6;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
    margin-top:auto;               /* 카드 하단에 고정 (PR 카드 foot과 같은 위치) */
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:760px){
    .hero{grid-template-columns:1fr; padding-top:40px;}
    .hero-minimal{padding:48px 24px 32px;}
    .hero-3d{width:260px; height:250px;}
    .posts-grid{grid-template-columns:1fr;}
    .contrib-grid{grid-template-columns:1fr;}
    .oss-heads{grid-template-columns:1fr;}
    .oss-head + .oss-head{
      border-left:none;
      border-top:1px solid var(--line);
    }
    .oss-row{grid-template-columns:1fr;}
    .filter-pills{gap:5px;}
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important;}
  }
</style>
</head>
<body>

<header>
  <nav class="nav">
    <img class="logo" src="mark.jpg" alt="chjnett">
  </nav>
</header>

<section class="hero hero-minimal">
  <a href="https://github.com/chjnett" class="github-icon-link" target="_blank" rel="noopener" aria-label="GitHub 프로필로 이동">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor" aria-hidden="true">
      <path d="M12 0.5C5.65 0.5 0.5 5.65 0.5 12c0 5.08 3.29 9.39 7.86 10.91.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.11-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.68-1.28-1.68-1.04-.72.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.69 1.25 3.35.96.1-.75.4-1.25.73-1.53-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.77.11 3.06.74.8 1.19 1.83 1.19 3.09 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.07.78 2.15 0 1.55-.01 2.8-.01 3.18 0 .3.21.66.79.55A10.51 10.51 0 0 0 23.5 12C23.5 5.65 18.35 0.5 12 0.5Z"/>
    </svg>
  </a>
  <h1 class="hero-name">Hyeonjun Cheon</h1>
  <p class="hero-tagline">AI Engineer · 오픈소스 기여자 · 기술 블로거</p>
  <canvas id="hero3d" class="hero-3d" aria-hidden="true"></canvas>
</section>

<!-- 카테고리 필터 -->
<div class="filter-wrap" id="filterWrap" style="display:none" aria-label="카테고리 필터">
  <p class="filter-label">Category</p>
  <div class="filter-pills" id="filterPills" role="group" aria-label="태그 필터"></div>
</div>

<section class="posts">
  <p class="posts-count" id="postsCount" aria-live="polite"></p>
  <div class="posts-grid" id="postsGrid">
    <div class="empty-state" id="emptyState">해당 카테고리의 글이 없습니다.</div>
  </div>
</section>

<!-- 오픈소스: 브랜치(좌) + 기여한 글(우) — 하나의 패널, 카드 쌍 행 -->
<div class="oss-grid">
  <div class="oss-panel" id="ossPanel" style="display:none">
    <div class="oss-heads">
      <div class="oss-head">
        <span class="pr-title">Open Source PRs</span>
        <span class="pr-summary" id="prSummary"></span>
        <p class="pr-updated" id="prUpdated"></p>
      </div>
      <div class="oss-head">
        <span class="pr-title">기여한 글</span>
        <span class="pr-summary" id="contribCount"></span>
      </div>
    </div>
    <div class="oss-rows" id="ossRows"></div>
  </div>
</div>

<script>
  function escapeHtml(value) {
    return value
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  let allPosts   = [];
  let activeTag  = null;   // null = 전체

  /* ── 필터 버튼 클릭 ── */
  function setTag(tag) {
    activeTag = tag;

    // 버튼 active 상태 갱신
    document.querySelectorAll('.pill').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.tag === (tag ?? '__all__'));
      btn.setAttribute('aria-pressed', btn.dataset.tag === (tag ?? '__all__') ? 'true' : 'false');
    });

    renderCards();
  }

  /* ── 카드 표시/숨김 ── */
  function renderCards() {
    const cards  = document.querySelectorAll('.post-card');
    let visible  = 0;

    cards.forEach((card) => {
      const tags = JSON.parse(card.dataset.tags || '[]');
      const show = activeTag === null || tags.includes(activeTag);
      card.classList.toggle('hidden', !show);
      if (show) visible++;

      // 일치 태그 강조
      card.querySelectorAll('.post-tag').forEach((el) => {
        el.classList.toggle('match', activeTag !== null && el.dataset.tag === activeTag);
      });
    });

    // 카운트 텍스트
    const countEl = document.getElementById('postsCount');
    if (activeTag) {
      countEl.textContent = `#${activeTag} — ${visible}개`;
    } else {
      countEl.textContent = `전체 ${visible}개`;
    }

    // 빈 상태
    document.getElementById('emptyState').classList.toggle('visible', visible === 0);
  }

  /* ── 필터 버튼 빌드 ── */
  function buildFilter(posts) {
    const tagCount = {};
    posts.forEach((p) => {
      (p.tags || []).forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; });
    });

    // 빈도순 정렬
    const sorted = Object.entries(tagCount).sort((a, b) => b[1] - a[1]);

    const wrap = document.getElementById('filterPills');

    // 전체 버튼
    const all = document.createElement('button');
    all.className = 'pill active';
    all.textContent = '전체';
    all.dataset.tag = '__all__';
    all.setAttribute('aria-pressed', 'true');
    all.addEventListener('click', () => setTag(null));
    wrap.appendChild(all);

    // 태그 버튼
    sorted.forEach(([tag, cnt]) => {
      const btn = document.createElement('button');
      btn.className = 'pill';
      btn.textContent = `#${tag}`;
      btn.dataset.tag = tag;
      btn.setAttribute('aria-pressed', 'false');
      btn.title = `${cnt}개의 글`;
      btn.addEventListener('click', () => setTag(tag));
      wrap.appendChild(btn);
    });

    document.getElementById('filterWrap').style.display = '';
  }

  /* ── 카드 빌드 ── */
  function buildCards(posts) {
    const grid = document.getElementById('postsGrid');

    // 기존 카드 제거 (emptyState는 유지)
    grid.querySelectorAll('.post-card').forEach((el) => el.remove());

    posts.forEach((post) => {
      // 오픈소스 기여글(oss-*)은 아래 '기여한 글' 섹션에서 별도 표시.
      if (post.slug.startsWith('oss-')) return;
      const tagsJson = JSON.stringify(post.tags || []);
      const tagsHtml = (post.tags || []).map((tag) =>
        `<span class="post-tag" data-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</span>`
      ).join('');

      const a = document.createElement('a');
      a.className = 'post-card';
      a.href = `/posts/${encodeURIComponent(post.slug)}`;
      a.dataset.tags = tagsJson;
      a.innerHTML = `
        <span class="post-date">${escapeHtml((post.published_at || '').slice(0, 10))}</span>
        <h2 class="post-title">${escapeHtml(post.title)}</h2>
        <p class="post-excerpt">${escapeHtml(post.excerpt || '')}</p>
        <div class="post-tags">${tagsHtml}</div>
      `;
      // emptyState 앞에 삽입
      grid.insertBefore(a, document.getElementById('emptyState'));
    });
  }

  /* ── 기여한 글(oss-*) 카드 HTML ── */
  function contribCardHtml(p) {
    const tags = (p.tags || []).slice(0, 3)
      .map((t) => `<span class="contrib-tag">#${escapeHtml(t)}</span>`).join('');
    return `<a class="contrib-card" href="/oss/${encodeURIComponent(p.slug)}">
      <div class="contrib-meta">
        <span class="contrib-repo">OSS 기여</span>
        ${tags}
      </div>
      <div class="contrib-title">${escapeHtml(p.title)}</div>
      <p class="contrib-excerpt">${escapeHtml(p.excerpt || '')}</p>
    </a>`;
  }

  /* ── 오픈소스 패널: PR 카드 + 기여 카드를 같은 행으로 짝지어 렌더 ── */
  let prItems = null;
  let contribItems = [];

  function renderOssRows() {
    if (!prItems || contribItems.length === 0) return;
    // 각 PR을 자기 기여글(post_slug)과 짝짓는다 (없으면 인덱스 폴백)
    const bySlug = {};
    contribItems.forEach((p) => { bySlug[p.slug] = p; });
    const rows = prItems
      .map((pr, i) => {
        const post = bySlug[pr.post_slug] || contribItems[i] || null;
        const contrib = post ? contribCardHtml(post) : '';
        return `<div class="oss-row">${prCardHtml(pr)}${contrib}</div>`;
      })
      .join('');
    document.getElementById('ossRows').innerHTML = rows;
    document.getElementById('ossPanel').style.display = '';
  }

  function buildContrib(posts) {
    contribItems = posts.filter((p) => p.slug.startsWith('oss-'));
    if (!contribItems.length) return;
    document.getElementById('contribCount').textContent = `${contribItems.length}건`;
    renderOssRows();
  }

  /* ── 데이터 로드 ── */
  fetch('/api/posts')
    .then((res) => res.json())
    .then((posts) => {
      // 기여글(oss-*)은 별도 섹션으로, 일반 글 목록/필터에서는 제외
      buildContrib(posts);                              // 기여한 글 섹션
      allPosts = posts.filter((p) => !p.slug.startsWith('oss-'));
      buildCards(allPosts);
      buildFilter(allPosts);
      renderCards();         // 초기 카운트 표시
    })
    .catch((err) => console.error('failed to load posts', err));

  /* ── 상태 배지/브랜치 클래스/PR 카드 HTML ── */
  function stateBadge(pr) {
    if (pr.merged) return '<span class="pr-state merged">머지</span>';
    if (pr.state === 'open') {
      const ci = pr.ci_combined;
      if (ci === 'failure') {
        return '<span class="pr-state ci-failure">CI 실패</span>';
      }
      if (ci === 'pending') {
        return '<span class="pr-state open">진행</span>';
      }
      return '<span class="pr-state open">open</span>';
    }
    return '<span class="pr-state closed">closed</span>';
  }

  function branchClass(pr) {
    if (pr.merged) return ' pr-branch merged';
    if (pr.state === 'open' && pr.ci_combined === 'failure') return ' pr-branch ci-failure';
    return pr.state === 'open' ? ' pr-branch' : ' pr-branch closed';
  }

  function prCardHtml(pr) {
    // 연관 기여 글이 있으면 /oss/:slug로, 없으면 GitHub PR로 폴백.
    const href = pr.post_slug ? `/oss/${encodeURIComponent(pr.post_slug)}` : pr.url;
    const external = !pr.post_slug;
    const title = escapeHtml(pr.title || `#${pr.pr_number}`);
    const repo = escapeHtml(pr.repo || '');
    const extAttr = external ? ' target="_blank" rel="noopener"' : '';
    // 카드 = div, 노드(●──)는 GitHub PR 링크, 본문은 기여글(or GitHub) 링크
    return `<div class="${branchClass(pr).trim()}">
      <a class="pr-node" href="${pr.url}" target="_blank" rel="noopener"
         aria-label="GitHub에서 PR 열기" title="GitHub에서 열기"></a>
      <a class="pr-branch-main" href="${href}"${extAttr}>
        <div class="pr-branch-row">
          <span class="pr-branch-repo">${repo}</span>
          <span class="pr-branch-num">#${pr.pr_number}</span>
          ${stateBadge(pr)}
        </div>
        <div class="pr-branch-title">${title}</div>
        <div class="pr-branch-foot">
          <span class="pr-branch-read">${pr.post_slug ? '이 기여 · 글 보기' : 'GitHub에서 보기'}</span>
        </div>
      </a>
    </div>`;
  }

  /* ── PR 상태 로드 ── */
  function loadPrs() {
    fetch('/api/prs')
      .then((res) => (res.ok ? res.json() : Promise.reject(res.status)))
      .then((data) => {
        if (!data.items || data.items.length === 0) {
          document.getElementById('prSummary').textContent = '기여한 PR 없음';
          return;
        }
        prItems = data.items;
        document.getElementById('prSummary').textContent =
          `${data.items.length}건 · ` +
          (data.open > 0 ? `열림 ${data.open}건` : '열림 없음') +
          (data.merged > 0 ? ` · 머지 ${data.merged}건` : '');
        const updated = data.last_updated ? (data.last_updated.slice(0, 16) || '').replace('T', ' ') : '—';
        document.getElementById('prUpdated').textContent = `마지막 갱신: ${updated}`;
        renderOssRows();
      })
      .catch((err) => console.warn('failed to load PRs', err));
  }
  loadPrs();
</script>
