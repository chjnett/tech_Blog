name = "tech-blog-worker"
main = "src/index.ts"
compatibility_date = "2026-08-02"

[[d1_databases]]
binding = "DB"
database_name = "tech_blog_db"
database_id = "cc9ed78a-0d1a-4718-923c-a99ff8a2edc5"

[vars]
SITE_URL = "https://<YOUR_DOMAIN>"

[[routes]]
pattern = "<YOUR_DOMAIN>/api/*"
zone_name = "<YOUR_DOMAIN>"

[[routes]]
pattern = "<YOUR_DOMAIN>/rss.xml"
zone_name = "<YOUR_DOMAIN>"

[dev]
# wrangler dev can't infer a host from the <YOUR_DOMAIN> placeholder routes above;
# this only affects local dev, not what gets deployed.
host = "localhost"
