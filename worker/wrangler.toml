name = "tech-blog-worker"
main = "src/index.ts"
compatibility_date = "2026-08-02"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "tech_blog_db"
database_id = "cc9ed78a-0d1a-4718-923c-a99ff8a2edc5"

[vars]
SITE_URL = "https://tech-blog-worker.cheonhyeonjun583.workers.dev"

[dev]
# No zone-based routes (deploying to the free workers.dev subdomain, not a
# custom domain), so wrangler dev can't infer a host on its own.
host = "localhost"

[assets]
directory = "../pages"
